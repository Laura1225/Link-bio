name: Atualizar portfólio do Behance
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-portfolio.mjs
      - name: Publicar se mudou
        run: |
          if ! git diff --quiet; then
            git config user.name "bio-bot"
            git config user.email "bio-bot@users.noreply.github.com"
            git commit -am "Portfólio: novo projeto do Behance"
            git push
          fi
