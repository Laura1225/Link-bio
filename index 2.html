  <style>
:root {
  --bg: #050506;
  --card: #0b0b0d;
  --card-2: #101013;
  --line: rgba(255,255,255,0.09);
  --text: #f5f5f6;
  --muted: rgba(255,255,255,0.54);
  --dim: rgba(255,255,255,0.38);
  --accent: #FF0A33;
  --accent-2: #ff4d6a;
  --sans: "Manrope", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
  cursor:none;
}
a{color:inherit;text-decoration:none;}

/* ── fundo WebGL ── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;filter:brightness(1.15);}
.bglines{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto;}

/* ── cursor custom ── */
#cur-dot{
  position:fixed;z-index:9999;pointer-events:none;
  width:8px;height:8px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px 3px #FF0A33, 0 0 18px 8px rgba(255,10,51,0.5);
  transform:translate(-50%,-50%);
  transition:opacity .2s;
}
/* cursor só em dispositivos com mouse — some em touch/tablet */
@media(pointer:coarse){
  #cur-dot,#cur-ring,#cur-canvas{display:none!important;}
  body{cursor:auto;}
}
#cur-ring{
  position:fixed;z-index:9998;pointer-events:none;
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(255,10,51,0.7);
  box-shadow:0 0 10px 2px rgba(255,10,51,0.3), inset 0 0 10px 2px rgba(255,10,51,0.1);
  transform:translate(-50%,-50%);
  transition:width .18s var(--ease), height .18s var(--ease),
             border-color .18s, box-shadow .18s, opacity .2s;
}
#cur-canvas{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:9997;pointer-events:none;
}

/* ── layout ── */
.wrap{
  position:relative;z-index:2;
  width:100%;
  /* flui de 480px (mobile) até 820px (~29pol), trava acima disso */
  max-width:clamp(480px,52vw,820px);
  margin:0 auto;
  padding:clamp(32px,6vh,64px) clamp(16px,3vw,32px) 72px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}

/* ── avatar ── */
.avatar{position:relative;width:112px;height:112px;margin-bottom:22px;}
/* dentro do sistema orbital o avatar escala com a tela */
.avatar-orbit-wrapper .avatar{width:clamp(112px,29vw,148px);height:clamp(112px,29vw,148px);}
.avatar__ring{
  position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from 0deg,#FF0A33 0%,#ff6680 25%,#FF0A33 50%,#aa001f 75%,#FF0A33 100%);
  animation:spin 7s linear infinite;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3.5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3.5px));
}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes o-spin-cw{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}@keyframes o-spin-ccw{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(-360deg);}}@keyframes pill-ccw{to{rotate:-360deg;}}@keyframes pill-cw{to{rotate:360deg;}}
.avatar__img,.avatar__fb{
  position:absolute;inset:0;width:100%;height:100%;
  border-radius:50%;object-fit:cover;object-position:center 18%;
  border:3.5px solid #050506;
  box-shadow:0 16px 48px -12px rgba(255,10,51,0.75);
}
.avatar__fb{
  display:none;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#FF0A33,#8B0018);
  font-size:40px;font-weight:700;color:#fff;
}

/* ── texto ── */
.name{
  font-size:clamp(34px,9vw,52px);font-weight:800;
  letter-spacing:-0.035em;line-height:1.0;
  background:linear-gradient(135deg,#ffffff 40%,rgba(255,255,255,0.75) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.handle{
  color:var(--accent-2);font-size:clamp(15px,4vw,18px);margin-top:9px;
  letter-spacing:0.01em;font-weight:500;
}
.handle:empty{display:none;}
.bio{
  color:rgba(255,255,255,0.85);
  font-size:clamp(14.5px,3.8vw,17px);
  margin-top:20px;line-height:1.18;
  font-weight:400;letter-spacing:-0.01em;
  text-wrap:pretty;max-width:100%;
}
@media(max-width:430px){
  .bio{font-size:13px;text-wrap:balance;letter-spacing:-0.02em;}
}
.bio strong{font-weight:800;color:#fff;}
.bio em{font-style:italic;font-family:'Lora',Georgia,serif;color:#fff;font-weight:700;letter-spacing:0;}

/* ── socials ── */
.socials{display:flex;gap:9px;margin-top:22px;}
.socials a{
  display:grid;place-items:center;width:40px;height:40px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:rgba(255,255,255,0.75);
  transition:transform .25s var(--ease),background .25s,border-color .25s,color .25s,box-shadow .25s;
}
.socials a:hover{
  transform:translateY(-3px);background:rgba(255,10,51,0.14);
  border-color:rgba(255,77,106,0.45);color:#fff;
  box-shadow:0 8px 24px -8px rgba(255,10,51,0.35);
}
.socials svg{width:17px;height:17px;}

/* ── links ── */
.links{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:32px;}

/* card: flex row — banner esquerda, texto direita */
.link{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:row;align-items:center;
  min-height:clamp(106px,12vw,160px);
  border-radius:clamp(14px,1.5vw,22px);
  border:none;
  background:#0c0c0e;
  text-decoration:none;color:#fff;
  transition:transform .32s var(--ease),box-shadow .32s;
}
.link--alt {
  background:#16141a;
}
.link:hover{
  transform:translateY(-4px);
  box-shadow:0 24px 52px -14px rgba(255,10,51,0.5);
}

/* banner esquerda: cover para preencher sem caixa preta */
.link__img-wrap{
  /* ratio exato das imagens: 3840×1564 = 2.46:1 — sem corte */
  flex:0 0 auto;
  width:55%;
  aspect-ratio:1400/675;
  align-self:center;
  position:relative;
  overflow:hidden;
  background:transparent;
}
.link__bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:fill; /* container já tem o ratio certo, fill sem distorção */
  display:block;
  transition:transform .55s var(--ease);
  user-select:none;pointer-events:none;
}
.link:hover .link__bg{transform:scale(1.04);}

/* divisor vermelho sutil */
.link__img-wrap::after{
  content:"";position:absolute;top:0;right:0;bottom:0;
  width:1px;
  background:linear-gradient(to bottom,transparent,rgba(255,10,51,0.22),transparent);
  z-index:1;
}

/* texto direita, centralizado verticalmente */
.link__tx{
  flex:1;min-width:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(14px,2vw,24px) clamp(16px,2.2vw,28px);
  text-align:left;
  position:relative;z-index:1;
}
.link__tx b{
  display:block;font-weight:700;font-size:clamp(13px,1.6vw,20px);
  letter-spacing:-0.02em;line-height:1.25;color:#fff;
  text-wrap:balance;
}
.link__tx span:not(.link__go){
  display:block;font-size:clamp(10px,1.2vw,15px);
  color:rgba(255,255,255,0.52);
  line-height:1.5;margin-top:5px;
  text-wrap:pretty;
  overflow-wrap:break-word;
}

/* shine sweep */
.link::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.04) 50%,transparent 70%);
  transform:translateX(-130%);transition:transform .75s var(--ease);
}
.link:hover::after{transform:translateX(130%);}

/* ── footer ── */
.foot{
  margin-top:40px;font-size:11.5px;color:rgba(255,255,255,0.28);
  letter-spacing:0.04em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding-bottom:8px;
}
.foot em{
  font-style:italic;font-family:'Lora',Georgia,serif;
  color:#fff;font-weight:700;letter-spacing:0;text-transform:none;
  font-size:13px;
}
.foot a{color:rgba(255,255,255,0.38);transition:color .2s;}
.foot a:hover{color:#fff;}
.foot img{opacity:0.55;transition:opacity .2s;vertical-align:middle;}
.foot img:hover{opacity:0.85;}

/* ── reveal ── */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal.is-in{opacity:1;transform:none;}
.link.reveal{transition-delay:calc(var(--i,0)*55ms);}
/* ── MOBILE: cards empilhados (banner em cima, texto embaixo) ── */
@media(max-width:520px){
  .links{gap:22px;}
  .link{
    flex-direction:column;
    align-items:stretch;
    min-height:unset;
  }
  .link__img-wrap{
    width:100%;
    aspect-ratio:1400/675;
    align-self:auto;
    border-radius:0;
  }
  .link__img-wrap::after{display:none;}
  .link__tx{
    padding:16px 20px 20px;
    text-align:center;
    align-items:center;
  }
  .link__tx b{font-size:clamp(14px,4.5vw,17px);}
  .link__tx span:not(.link__go){font-size:clamp(12px,3.2vw,14px);}
}

@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none;}
  .avatar__ring{animation:none;}
}

/* ═══════════════════════════════════════════════════════
   SISTEMA ORBITAL — estático, responsivo, centrado
   • Dois anéis concêntricos parados
   • Pílulas em posições fixas nos anéis
   • Apenas o arrastar é interativo
═══════════════════════════════════════════════════════ */
.avatar-orbit-wrapper {
  position: relative;
  /* proporcional à tela — funciona de 320px (mobile) até 1400px (desktop) */
  width: clamp(280px, 84vw, 440px);
  height: clamp(280px, 84vw, 440px);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2px;
  /* sem overflow:hidden — sem corte nas pílulas */
}
.avatar-orbit-wrapper .avatar { margin-bottom: 0; position: relative; z-index: 1; }

/* ── Camada 0: anéis (atrás da foto) ── */
.orbit-rings-bg {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 0;
}
/* ── Camada 2: pílulas (à frente) ── */
.orbit-pills-fg {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 2;
}

/* ── anéis visuais — estáticos ── */
.orbit-ring {
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  transform-origin: 50% 50%;
}
.orbit-ring--inner {
  /* ~60% do wrapper — gira horário */
  width: clamp(168px, 50vw, 264px);
  height: clamp(168px, 50vw, 264px);
  border: 1px solid rgba(255,255,255,0.20);
  box-shadow: 0 0 30px rgba(255,10,51,0.06), inset 0 0 30px rgba(255,10,51,0.04);
  animation: o-spin-cw 20s linear infinite;
  will-change: transform;
}
.orbit-ring--inner::before {
  content: '';
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #FF0A33;
  box-shadow: 0 0 10px 4px rgba(255,10,51,0.75), 0 0 22px 8px rgba(255,10,51,0.35);
}
.orbit-ring--outer {
  /* ~87% do wrapper — gira anti-horário */
  width: clamp(244px, 73vw, 383px);
  height: clamp(244px, 73vw, 383px);
  border: 1px solid rgba(255,255,255,0.15);
  animation: o-spin-ccw 30s linear infinite;
  will-change: transform;
}
.orbit-ring--outer::before {
  content: '';
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  box-shadow: 0 0 8px 3px rgba(255,10,51,0.5), 0 0 18px 6px rgba(255,10,51,0.25);
}

/* ── spinners invisíveis que posicionam as pílulas ── */
.orbit-spinner {
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  transform: translate(-50%, -50%); /* estático — JS anima as pílulas */
}
.orbit-spinner--inner {
  width: clamp(168px, 50vw, 264px);
  height: clamp(168px, 50vw, 264px);
}
.orbit-spinner--outer {
  width: clamp(244px, 73vw, 383px);
  height: clamp(244px, 73vw, 383px);
}

/* ── braço de posicionamento ── */
.orbit-pill-wrap {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  transform: rotate(var(--angle)) translateX(var(--r));
}
/* raio = metade do diâmetro do anel correspondente */
.orbit-spinner--inner .orbit-pill-wrap { --r: clamp(84px, 25vw, 132px); }
.orbit-spinner--outer .orbit-pill-wrap { --r: clamp(122px, 36.5vw, 191px); }

/* ── ponto conector (dot na interseção pill↔anel) ── */
.orbit-pill-wrap::before {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.30);
  transform: translate(-50%, -50%);
  pointer-events: none;
  box-shadow: 0 0 6px 2px rgba(255,10,51,0.35);
}

/* ── pílula de texto ── */
.orbit-pill {
  position: absolute;
  left: 0; top: 0;
  /* cancela o rotate do pill-wrap → texto sempre reto */
  transform: translateX(-50%) translateY(-50%) rotate(calc(-1 * var(--angle)));
  white-space: nowrap;
  font-family: var(--sans);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.92);
  background: rgba(8,8,12,0.80);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,10,51,0.35);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: clamp(9px, 2.3vw, 11px);
  pointer-events: none;
  cursor: default;
  box-shadow: 0 2px 18px rgba(0,0,0,0.55);
}
.orbit-spinner--inner .orbit-pill {
  /* anel interno — pills mais destacadas */
  border-color: rgba(255,10,51,0.42);
  box-shadow: 0 0 14px -2px rgba(255,10,51,0.4), 0 2px 18px rgba(0,0,0,0.55);
  position: absolute;
}
.orbit-spinner--outer .orbit-pill {
  /* anel externo — pills mais suaves */
  border-color: rgba(255,10,51,0.22);
  color: rgba(255,255,255,0.78);
  background: rgba(8,8,12,0.68);
  box-shadow: 0 0 10px -2px rgba(255,10,51,0.25), 0 2px 18px rgba(0,0,0,0.55);
  position: absolute;
}
/* ── intercalação de cor: 1 de cada 2 pílulas fica vermelha ── */
.orbit-pill-wrap:nth-child(odd) .orbit-pill {
  background: #FF0A33;
  color: #050506;
  border-color: #FF0A33;
  box-shadow: 0 0 18px rgba(255,10,51,0.55), 0 2px 18px rgba(0,0,0,0.4);
}



@media(prefers-reduced-motion:reduce){
  .orbit-ring--inner,.orbit-ring--outer,
  .orbit-spinner--inner,.orbit-spinner--outer,
  .orbit-spinner--inner .orbit-pill,
  .orbit-spinner--outer .orbit-pill { animation:none; transform:translate(-50%,-50%); }
}

/* ═══════════════════════════════════════════════════════
   CARDS — borda conica girando no hover
═══════════════════════════════════════════════════════ */
@property --ba {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

.link-wrap {
  position: relative;
  border-radius: clamp(14px,1.5vw,22px);
  padding: 1.5px;
  box-shadow: 0 4px 24px -10px rgba(255,10,51,0.18);
  transition: box-shadow 0.4s var(--ease);
}

.link-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: conic-gradient(from var(--ba),
    transparent      0deg,
    transparent    200deg,
    rgba(255,77,106,0.45) 238deg,
    #FF0A33        265deg,
    rgba(255,255,255,0.92) 270deg,
    #FF0A33        275deg,
    rgba(255,77,106,0.45) 305deg,
    transparent    345deg,
    transparent    360deg
  );
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
  z-index: 0;
}

.link-wrap:hover::before {
  opacity: 1;
  animation: card-border-spin 2.2s linear infinite;
}

.link-wrap:hover {
  box-shadow:
    0 0 0 1px rgba(255,10,51,0.18),
    0 12px 40px -8px rgba(255,10,51,0.3),
    0 28px 60px -20px rgba(255,10,51,0.18);
}

@keyframes card-border-spin { to { --ba: 360deg; } }

.link-wrap .link {
  position: relative;
  z-index: 1;
  width: 100%;
}

.link-wrap .link:hover {
  box-shadow: none;
}

.link::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 65%;
  background: radial-gradient(ellipse at 50% 105%, rgba(255,10,51,0.11) 0%, transparent 68%);
  z-index: 0;
  opacity: 0;
  transition: opacity 0.55s var(--ease);
  pointer-events: none;
}
.link:hover::before { opacity: 1; }

@media(prefers-reduced-motion:reduce){
  .orbit-ring--inner,.orbit-ring--outer,
  .orbit-spinner--inner,.orbit-spinner--outer,
  .orbit-spinner--inner .orbit-pill,.orbit-spinner--outer .orbit-pill { animation:none; }
  .link-wrap::before { animation:none !important; }
}

    '  float p=clamp(length(pointer),0.0,1.0);',
    '  p=0.5*pow(1.0-p,2.0);',
    '  float t=u_speed*u_time;',
    '  vec3 col=vec3(0.0);',
    '  float noise=neuro_shape(uv,t,p);',
    '  noise=1.2*pow(noise,3.0);',
    '  noise+=pow(noise,10.0);',
    '  noise=max(0.0,noise-0.5);',
    '  noise*=(1.0-length(vUv-0.5));',
    '  col=u_color*noise;',
    '  gl_FragColor=vec4(col,noise);}',
  ].join('\n');

  function compile(src,type){
    var sh=gl.createShader(type);
    gl.shaderSource(sh,src); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){gl.deleteShader(sh);return null;}
    return sh;
  }
  var vs=compile(VERT,gl.VERTEX_SHADER), fs=compile(FRAG,gl.FRAGMENT_SHADER);
  if(!vs||!fs) return;
  var prog=gl.createProgram();
  gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return;

  var uniforms={};
  var count=gl.getProgramParameter(prog,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<count;i++){
    var nm=gl.getActiveUniform(prog,i).name;
    uniforms[nm]=gl.getUniformLocation(prog,nm);
  }

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.useProgram(prog);
  var posLoc=gl.getAttribLocation(prog,'a_position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);

  gl.uniform3f(uniforms.u_color, COLOR[0], COLOR[1], COLOR[2]);
  gl.uniform1f(uniforms.u_speed, SPEED);

  function resize(){
    /* renderiza em resolução baixa fixa e CSS faz o upscale — truque eficiente */
    var MAX_W = 480, MAX_H = 640;
    var w = Math.min(Math.round(canvas.clientWidth  * 0.4), MAX_W);
    var h = Math.min(Math.round(canvas.clientHeight * 0.4), MAX_H);
    if(!w||!h) return;
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
    gl.uniform1f(uniforms.u_ratio, canvas.width/canvas.height);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  resize();
  window.addEventListener('resize', resize);

  var pointer = {x:0.5, y:0.5, tX:0.5, tY:0.5};
  function setPointer(x,y){
    var r = canvas.getBoundingClientRect();
    pointer.tX = (x - r.left) / (r.width  || 1);
    pointer.tY = (y - r.top)  / (r.height || 1);
  }
  window.addEventListener('pointermove', function(e){ setPointer(e.clientX,e.clientY); });
  window.addEventListener('touchmove',   function(e){
    if(e.targetTouches[0]) setPointer(e.targetTouches[0].clientX, e.targetTouches[0].clientY);
  },{passive:true});

  var glRaf=0, glLast=0, GL_FPS=1000/24;
  function loop(ts){
    glRaf=requestAnimationFrame(loop);
    if(ts-glLast<GL_FPS) return;
    glLast=ts;
    pointer.x += (pointer.tX - pointer.x) * 0.15;
    pointer.y += (pointer.tY - pointer.y) * 0.15;
    gl.uniform1f(uniforms.u_time, performance.now());
    gl.uniform2f(uniforms.u_pointer_position, pointer.x, 1.0 - pointer.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  glRaf=requestAnimationFrame(loop);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ cancelAnimationFrame(glRaf); glRaf=0; }
    else if(!glRaf) glRaf=requestAnimationFrame(loop);
  });
})();
}, 0); /* defer WebGL após primeiro paint */


/* ============================================================
   CURSOR NEON + PARTÍCULAS VERMELHAS
============================================================ */
(function(){
  /* pula cursor e partículas em touch — não existe ponteiro */
  if(window.matchMedia('(pointer:coarse)').matches) return;
  const TAU    = Math.PI*2;
  const canvas = document.getElementById("cur-canvas");
  const ctx    = canvas.getContext("2d");
  const dot    = document.getElementById("cur-dot");
  const ring   = document.getElementById("cur-ring");
  let W=0,H=0,dpr=1;
  let mx=-500,my=-500,rx=-500,ry=-500,active=false;
  const parts=[];

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener("resize",resize);

  function spawn(x,y,burst){
    const n=burst?32:3;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU;
      const s=burst?(1+Math.random()*4):(0.2+Math.random()*1.2);
      const sz=burst?(1.5+Math.random()*2.5):(0.6+Math.random()*1.4);
      const cols=[[255,10,51],[255,60,80],[255,120,140],[255,200,210]];
      const [r,g,b]=cols[Math.floor(Math.random()*cols.length)];
      parts.push({
        x:x+(Math.random()-.5)*8, y:y+(Math.random()-.5)*8,
        vx:Math.cos(a)*s, vy:Math.sin(a)*s-(burst?.6:.1),
        r,g,b,sz,
        life:0.6+Math.random()*0.4,
        decay:burst?(0.014+Math.random()*0.018):(0.03+Math.random()*0.03),
      });
    }
  }

  let lastT=0,raf=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    if(active){
      const g=ctx.createRadialGradient(mx,my,0,mx,my,80);
      g.addColorStop(0,"rgba(255,10,51,0.18)");
      g.addColorStop(.5,"rgba(255,10,51,0.05)");
      g.addColorStop(1,"rgba(255,10,51,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx,my,80,0,TAU); ctx.fill();
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx; p.y+=p.vy;
      p.vy+=0.035; p.vx*=.97; p.vy*=.97;
      p.life-=p.decay;
      if(p.life<=0){parts.splice(i,1);continue;}
      const a=p.life*p.life, s=p.sz*(0.4+p.life*.8);
      if(s>1.2){
        const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s*5);
        gr.addColorStop(0,`rgba(${p.r},${p.g},${p.b},${(a*.85).toFixed(3)})`);
        gr.addColorStop(.35,`rgba(${p.r},${p.g},${p.b},${(a*.35).toFixed(3)})`);
        gr.addColorStop(1,`rgba(${p.r},${p.g},${p.b},0)`);
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,s*5,0,TAU); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(.3,s*.6),0,TAU);
      ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${Math.min(1,a*1.3).toFixed(3)})`;
      ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
    /* para o loop se não há mais partículas e mouse saiu */
    if(parts.length > 0 || active){
      raf=requestAnimationFrame(frame);
    } else {
      raf=0;
    }
  }

  window.addEventListener("mousemove",e=>{
    mx=e.clientX; my=e.clientY; active=true;
    dot.style.left=mx+"px"; dot.style.top=my+"px";
    ring.style.left=mx+"px"; ring.style.top=my+"px";
    const now=performance.now();
    if(now-lastT>12){spawn(mx,my,false);lastT=now;}
    if(!raf)raf=requestAnimationFrame(frame);
  },{passive:true});

  /* burst removido */

  /* ring segue o mouse diretamente, sem lag */

  document.addEventListener("mouseover",e=>{
    const over=e.target.closest("a,button");
    ring.style.width  =over?"54px":"34px";
    ring.style.height =over?"54px":"34px";
    ring.style.borderColor=over?"rgba(255,10,51,1)":"rgba(255,10,51,0.7)";
    ring.style.boxShadow=over
      ?"0 0 22px 8px rgba(255,10,51,0.5),inset 0 0 14px 4px rgba(255,10,51,0.2)"
      :"0 0 10px 2px rgba(255,10,51,0.3),inset 0 0 10px 2px rgba(255,10,51,0.1)";
  });

  window.addEventListener("mouseleave",()=>{active=false;dot.style.opacity="0";ring.style.opacity="0";});
  window.addEventListener("mouseenter",()=>{dot.style.opacity="1";ring.style.opacity="1";});

  /* frame inicia apenas no primeiro movimento do mouse */
})();



/* ── Orbital JS — pílulas grudadas nos anéis ── */
(function(){
  var innerWraps = [].slice.call(document.querySelectorAll('.orbit-spinner--inner .orbit-pill-wrap'));
  var outerWraps = [].slice.call(document.querySelectorAll('.orbit-spinner--outer .orbit-pill-wrap'));

  function baseAngle(el){
    return parseFloat(el.style.getPropertyValue('--angle')) || 0;
  }

  var innerR = 0, outerR = 0;
  function measureR(){
    var iS = document.querySelector('.orbit-spinner--inner');
    var oS = document.querySelector('.orbit-spinner--outer');
    if(iS) innerR = iS.getBoundingClientRect().width / 2;
    if(oS) outerR = oS.getBoundingClientRect().width / 2;
  }

  var start = null, orbRaf = 0, orbLast = 0, ORB_FPS = 1000/30;
  function frame(ts){
    orbRaf = requestAnimationFrame(frame);
    if(ts - orbLast < ORB_FPS) return;
    orbLast = ts;
    if(!start){ start = ts; measureR(); }
    var elapsed = ts - start;
    var tIn  =  (elapsed / 20000) * 360;
    var tOut = -(elapsed / 30000) * 360;

    innerWraps.forEach(function(wrap){
      var a = baseAngle(wrap) + tIn;
      wrap.style.transform = 'rotate('+a+'deg) translateX('+innerR+'px)';
      var pill = wrap.querySelector('.orbit-pill');
      if(pill) pill.style.transform = 'translateX(-50%) translateY(-50%) rotate('+(-a)+'deg)';
    });
    outerWraps.forEach(function(wrap){
      var a = baseAngle(wrap) + tOut;
      wrap.style.transform = 'rotate('+a+'deg) translateX('+outerR+'px)';
      var pill = wrap.querySelector('.orbit-pill');
      if(pill) pill.style.transform = 'translateX(-50%) translateY(-50%) rotate('+(-a)+'deg)';
    });
  }

  window.addEventListener('resize', measureR);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ cancelAnimationFrame(orbRaf); orbRaf=0; }
    else if(!orbRaf) orbRaf=requestAnimationFrame(frame);
  });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ orbRaf=requestAnimationFrame(frame); });
  } else {
    orbRaf=requestAnimationFrame(frame);
  }
})();
</script>
